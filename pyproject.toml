[project]
name = "autotext"
version = "1.3.1"
description = "Text expansion system with Django backend API and Chrome extension"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Popa Cosmin", email = "poparcosmin@gmail.com" },
]
dependencies = [
    "Django==5.2.7",
    "djangorestframework==3.15",
    "django-cors-headers==4.7.0",
    "django-tinymce==4.1.0",
    "python-dotenv==1.2.1",
    "Pillow==12.0.0",
    "gunicorn==23.0.0",
    "django-redis==5.4.0",
    "bleach==6.2.0",
    "structlog==24.4.0",
    "tinycss2>=1.5.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.11",
    "django-silk>=5.5.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "pre-commit>=4.6.0",
]
research = [
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.150.0",
    "google-auth-httplib2>=0.2.0",
    "pydantic>=2.9.0",
    "tenacity>=9.0.0",
    "rich>=13.9.0",
    "pandas>=2.2.0",
    "structlog>=24.4.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.13"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["textsync/services", "config/settings.py"]
exclude = ["migrations/"]
